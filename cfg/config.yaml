# configuration file for training

seed: 5
cuda_deterministic: True
log_interval: 10               # How often to print training logs

env:
  id: OnlinePack-v1            # gym env id
  scheme: EMS                  # candidate 생성 방식(현재는 EMS 기준으로 사용)
  rot: True
  box_type: bed                 # 현재 브랜치는 BED 모드만 지원

  # BED split 경로를 학습/평가에서 분리해 고정 사용한다.
  bed_dataset_path_train: GOPT/data/bed_bpp/splits/bed_bpp_v1_train.json
  bed_dataset_path_val: GOPT/data/bed_bpp/splits/bed_bpp_v1_val.json
  bed_dataset_path_test: GOPT/data/bed_bpp/splits/bed_bpp_v1_test.json
  bed_dataset_seed: 42
  bed_dataset_shuffle_orders: True

  # BED target 팔레트 높이는 mm 기준으로 고정한다.
  bed_target_height: 2000
  resolution_mm: 1

  # 고정 길이 관측 텐서 크기 설정
  max_boxes: 300
  max_candidates: 80
  max_points: 0

  # 레거시 호환 키(k_placement)는 max_candidates와 동일하게 유지한다.
  k_placement: 80
  container_size: [10, 10, 10]
  step:
  

train:
  algo: PPO
  clip_param: 0.3
  num_processes: 128    # the number of subprogresses, if debug, set to 1
  num_steps: 5
  epoch: 1000
  last_epoch: 200  
  batch_size: 128  
  step_per_epoch: 40000        # 2**15
  repeat_per_collect: 1
  gae_lambda: 0.96
  reward_type:            # optional: "terminal", None
  gamma: 1                  # discount factor for rewards (default: 1)

opt:  # optimizer
  optimizer: Adam              # optimizer: Adam, RMSprop
  lr: 7e-5                     # learning rate (RMSprop7e-4, 1e-6, Adam7e-5)
  lr_decay: True               # use a linear schedule on the learning rate
  eps: 1e-5                    # epsilon (default: 1e-5)
  alpha: 0.99                  # RMSprop alpha (default: 0.99)
  
loss:
  entropy: 0.001               # entropy term coefficient (default: 0.01)
  value: 0.5                   # value loss coefficient (default: 0.5)

model:
  padding_mask: False                   # padding mask
  embed_dim: 128
  heads: 1
  num_layers: 3
  forward_expansion: 2
  dropout: 0
